services:
  # The Co-located FastAPI & Celery Web Service
  - type: web
    name: maestro-api
    env: python
    plan: free
    rootDir: backend/maestro
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
